name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check (typecheck src + test, lint, format)
        run: npm run check

      - name: Contract artifact
        run: npm run docs:check

      - name: Contract lint
        run: npm run docs:lint

      - name: Contract coverage
        run: npm run contract:check

      - name: Contract guard self-test
        run: npm run contract:check -- --probe

      - name: Build
        run: npm run build

  test:
    name: Tests (fast suite)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fast
          path: coverage/fast/
          retention-days: 7
          if-no-files-found: warn
